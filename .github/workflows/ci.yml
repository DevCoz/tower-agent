name: Verify Agent
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: node scripts/build.mjs v3.0.0
      - name: Verify static binaries and installer
        run: |
          file dist/tower-agent-linux-* | tee /tmp/tower-binaries.txt
          test "$(grep -c 'statically linked' /tmp/tower-binaries.txt)" = 2
          sh -n dist/install.sh
          (cd dist && sha256sum -c checksums.txt)
          go test -count=1 -run TestBootstrap ./...
      - name: Exercise real Linux systemd, Snell and sing-box
        run: sudo --preserve-env=PATH env TOWER_SYSTEMD_TEST=1 "$(command -v go)" test -count=1 -v -run TestSystemdLifecycle ./...
      - uses: actions/upload-artifact@v4
        with:
          name: tower-agent-binaries-${{ matrix.runner }}
          path: dist/
          retention-days: 7
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/protocol-4'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tower-agent-binaries-ubuntu-24.04
          path: dist
      - name: Publish verified Agent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c checksums.txt)
          gh release create v3.0.0 dist/tower-agent-linux-amd64 dist/tower-agent-linux-arm64 dist/install.sh dist/manifest.json dist/checksums.txt --target "$GITHUB_SHA" --title "Tower Agent v3.0.0" --notes-file RELEASE_NOTES.md
